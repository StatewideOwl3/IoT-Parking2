<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Lot Simulation</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <style>
        .simulation-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 5px;
        }

        .control-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .control-group label {
            font-weight: bold;
        }

        .control-group input[type="range"] {
            width: 200px;
        }

        .log-container {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            height: 200px;
            overflow-y: scroll;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <svg width="180" height="40" viewBox="0 0 180 40">
                <path d="M12,15 L30,15 L24,27 L12,27 Z" fill="#4270F4" />
                <text x="38" y="27" fill="#262A39" font-size="20" font-weight="bold">ParkSafe</text>
            </svg>
        </div>
        <div class="nav-menu">
            <a href="index.html" class="nav-item active"><i class="fas fa-car"></i><span>Simulation</span></a>
            <a href="charts.html" class="nav-item"><i class="fas fa-chart-line"></i><span>Charts</span></a>
            <a href="#" class="nav-item"><i class="fas fa-cog"></i><span>Settings</span></a>
        </div>
        <div class="premium-box">
            <h3>Simulation Controls</h3>
            <button id="start-simulation" class="premium-btn">Start Simulation</button>
            <button id="stop-simulation" class="premium-btn" disabled>Stop Simulation</button>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <div class="welcome-section">
                <p class="greeting">Welcome to</p>
                <h1 class="welcome-title">ParkSafe Mall Simulation</h1>
            </div>
            <div class="top-nav">
                <div class="notifications">
                    <i class="fas fa-bell"></i>
                    <span class="notification-badge">0</span>
                </div>
                <div class="profile">
                    <img src="https://randomuser.me/api/portraits/men/44.jpg" alt="Profile" />
                </div>
            </div>
        </div>

        <div class="content-body">
            <div class="simulation-controls">
                <div class="control-group">
                    <label for="simulation-speed">Simulation Speed:</label>
                    <input type="range" id="simulation-speed" min="1" max="10" value="5">
                    <span id="speed-value">5</span>
                </div>
                <div class="control-group">
                    <label for="occupancy-rate">Occupancy Rate:</label>
                    <input type="range" id="occupancy-rate" min="0" max="100" value="50">
                    <span id="occupancy-value">50%</span>
                </div>
                <div class="control-group">
                    <label>Occupied Spots:</label>
                    <span id="occupied-count">0/12</span>
                </div>
                <div class="control-group">
                    <label>Last Update:</label>
                    <span id="last-update">Never</span>
                </div>
                <div class="control-group">
                    <label>Connection Status:</label>
                    <span id="connection-status" class="warning"><i class="fas fa-sync fa-spin"></i> Connecting...</span>
                </div>

            </div>
            <div class="parking-area">
            </div>
            <div class="log-container" id="log-container">
                </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
