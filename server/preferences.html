<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preferences - Parking Space Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="sidebar">
    <div class="logo">
        <svg width="180" height="40" viewBox="0 0 180 40">
            <path d="M12,15 L30,15 L24,27 L12,27 Z" fill="#4270F4" />
            <text x="38" y="27" fill="#262A39" font-size="20" font-weight="bold">ParkSafe</text>
        </svg>
    </div>
    <div class="nav-menu">
        <a href="main_page.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="accounts.html" class="nav-item"><i class="fas fa-user-circle"></i><span>Account</span></a>
        <a href="parking_spaces.html" class="nav-item"><i class="fas fa-parking"></i><span>Parking Spaces</span></a>
        <a href="preferences.html" class="nav-item active"><i class="fas fa-sliders-h"></i><span>Preferences</span></a>
        <a href="insights.html" class="nav-item"><i class="fas fa-chart-line"></i><span>Insights</span></a>
    </div>
    <div class="premium-box">
        <h3>Click to refresh statistics</h3>
        <button class="premium-btn">Refresh</button>
    </div>
</div>
<div class="main-content">
    <h1>Preferences</h1>
    <form id="preferences-form" class="transfer-card">
        <label for="total-spots">Total Parking Spots:</label>
        <input type="number" id="total-spots" min="1" required />
        <label for="sections">Sections (comma-separated):</label>
        <input type="text" id="sections" placeholder="e.g., Section A, Section B" />
        <button type="submit" class="promo-btn">Save</button>
    </form>
</div>
<script src="preferences.js"></script>
</body>
</html>
