<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parking Spaces - Parking Space Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
    <style>
        .parking-spots { display: flex; gap: 20px; flex-wrap: wrap; }
        .parking-spot { padding: 20px 40px; border: none; border-radius: 12px; font-size: 16px; cursor: default; }
        .available { background-color: var(--success); color: var(--white); }
        .occupied { background-color: var(--danger); color: var(--white); }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="logo">
        <svg width="180" height="40" viewBox="0 0 180 40">
            <path d="M12,15 L30,15 L24,27 L12,27 Z" fill="#4270F4" />
            <text x="38" y="27" fill="#262A39" font-size="20" font-weight="bold">ParkSafe</text>
        </svg>
    </div>
    <div class="nav-menu">
        <a href="main_page.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="accounts.html" class="nav-item"><i class="fas fa-user-circle"></i><span>Account</span></a>
        <a href="parking_spaces.html" class="nav-item active"><i class="fas fa-parking"></i><span>Parking Spaces</span></a>
        <a href="preferences.html" class="nav-item"><i class="fas fa-sliders-h"></i><span>Preferences</span></a>
        <a href="insights.html" class="nav-item"><i class="fas fa-chart-line"></i><span>Insights</span></a>
    </div>
    <div class="premium-box">
        <h3>Click to refresh statistics</h3>
        <button class="premium-btn">Refresh</button>
    </div>
</div>
<div class="main-content">
    <div class="header">
        <div class="welcome-section">
            <p class="greeting">Good day, Admin,</p>
            <h1 class="welcome-title">Parking Spaces</h1>
        </div>
        <div class="header-right">
            <div class="notification-bell">
                <i class="fas fa-bell"></i>
                <div class="notification-indicator"></div>
            </div>
            <div class="user-profile">
                <img src="profile_pic.jpeg" alt="Admin" class="profile-pic" />
            </div>
            <div class="search-bar">
                <form id="search-form" class="search2" method="get" action="main_page.html">
                    <input type="search" id="query" name="q" placeholder="Search">
                    <button type="submit"><i class="fas fa-search"></i></button>
                </form>
            </div>
        </div>
    </div>

    <div class="parking-spots">
        <button class="parking-spot" id="spot-1">Spot 1</button>
        <button class="parking-spot" id="spot-2">Spot 2</button>
        <button class="parking-spot" id="spot-3">Spot 3</button>
        <button class="parking-spot" id="spot-4">Spot 4</button>
        <button class="parking-spot" id="spot-5">Spot 5</button>
    </div>
</div>
<script src="parking_spaces.js"></script>
</body>
</html>
